name: Publish v1.2.15

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-1.2.15.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 52ddc4c5a06d171603dd9fff7d50c44990103839
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version
        shell: pwsh
        run: |
          $packageVersion = python -c "import pasajes_accesibles_cnrt; print(pasajes_accesibles_cnrt.__version__)"
          if ($packageVersion -ne "1.2.15") {
            throw "Se esperaba __version__=1.2.15 y se obtuvo $packageVersion"
          }

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -q

      - name: Compile Python sources
        run: python -m compileall -q pasajes_accesibles_cnrt launcher.py portable_updater.py tools

      - name: Inject update repository
        run: python tools/generate_build_info.py --repository "${{ github.repository }}"

      - name: Verify injected update repository
        shell: pwsh
        run: |
          $repository = python -c "from pasajes_accesibles_cnrt.build_info import GITHUB_REPOSITORY; print(GITHUB_REPOSITORY)"
          if ($repository -ne "${{ github.repository }}") {
            throw "El repositorio de actualizaciones no quedo inyectado correctamente"
          }

      - name: Install Playwright Chromium locally
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "${{ github.workspace }}\build\ms-playwright"
          python -m playwright install chromium

      - name: Build application
        run: pyinstaller --noconfirm PasajesAccesiblesCNRT.spec

      - name: Build portable updater helper
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name PasajesPortableUpdater `
            --distpath build\portable-helper `
            --workpath build\portable-helper-work `
            --specpath build\portable-helper-spec `
            portable_updater.py

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "No se encontro Inno Setup" }
          & $iscc "/DAppVersion=1.2.15" "/DBuildRoot=${{ github.workspace }}\dist\Pasajes Accesibles CNRT" "/DBrowserRoot=${{ github.workspace }}\build\ms-playwright" installer\PasajesAccesiblesCNRT.iss

      - name: Build portable package
        shell: pwsh
        run: |
          $portableParent = "release\portable"
          $portableRoot = "$portableParent\Pasajes Accesibles CNRT"
          Remove-Item $portableParent -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          Copy-Item "dist\Pasajes Accesibles CNRT\*" $portableRoot -Recurse -Force
          Copy-Item "build\ms-playwright" "$portableRoot\ms-playwright" -Recurse -Force
          Copy-Item "build\portable-helper\PasajesPortableUpdater.exe" "$portableRoot\PasajesPortableUpdater.exe" -Force
          "channel=portable`nversion=1.2.15" | Set-Content "$portableRoot\.portable" -Encoding ascii
          python tools\write_portable_manifest.py "$portableRoot" --version 1.2.15
          Compress-Archive -Path $portableRoot -DestinationPath "release\Pasajes_Accesibles_CNRT_Portable.zip" -CompressionLevel Optimal -Force

      - name: Write SHA-256
        shell: pwsh
        run: |
          $files = @(
            "release\Pasajes_Accesibles_CNRT_Setup.exe",
            "release\Pasajes_Accesibles_CNRT_Portable.zip"
          )
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256" -Encoding ascii
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $target = "52ddc4c5a06d171603dd9fff7d50c44990103839"
          $installer = "release\Pasajes_Accesibles_CNRT_Setup.exe"
          $portable = "release\Pasajes_Accesibles_CNRT_Portable.zip"
          gh release create "v1.2.15" `
            $installer "$installer.sha256" `
            $portable "$portable.sha256" `
            --target $target `
            --title "Pasajes Accesibles CNRT 1.2.15" --generate-notes
