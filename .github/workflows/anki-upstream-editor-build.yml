name: Anki upstream editor accessibility - full source build
on:
  push:
    branches: [audit/anki-a11y-generalized-2026-11]
    paths:
      - "anki-a11y/upstream-ready/**"
      - ".github/workflows/anki-upstream-editor-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned official Anki source
        uses: actions/checkout@v4
        with:
          repository: ankitects/anki
          ref: 827f4aa42681f1d60ab0fe4ad76eb75d767a385e
          path: upstream-anki
          persist-credentials: false

      - name: Validate and apply editor-only patch
        shell: bash
        working-directory: upstream-anki
        run: |
          git apply --check ../anki-a11y/upstream-ready/0001-editor-fields-accessible-names.patch
          git apply ../anki-a11y/upstream-ready/0001-editor-fields-accessible-names.patch
          git diff --check
          git diff --stat
          test "$(git diff --name-only | wc -l)" -eq 4

      - name: Setup official Anki build environment
        uses: ./upstream-anki/.github/actions/setup-anki

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Build compiled Rust, Qt and Svelte application
        shell: bash
        working-directory: upstream-anki
        env:
          CARGO_BUILD_JOBS: "2"
        run: just build

      - name: Execute project's editor Svelte lint and type checks
        shell: bash
        working-directory: upstream-anki
        env:
          CARGO_BUILD_JOBS: "2"
        run: just lint

      - name: Inspect resulting compiled editor asset
        shell: bash
        working-directory: upstream-anki
        run: |
          find out -type f \( -name '*editor*.js' -o -name 'aqt*.whl' \) | head -n 40
          echo 'Complete Anki build and lint finished successfully.' >> "$GITHUB_STEP_SUMMARY"
