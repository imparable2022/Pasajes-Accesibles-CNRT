name: Validate Qt WebEngine UIA MathML draft
on:
  push:
    branches: [audit/anki-a11y-generalized-2026-11]
    paths:
      - "qt-math-a11y/**"
      - ".github/workflows/qt-math-a11y-qt-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit patches
        uses: actions/checkout@v4
        with:
          path: audit
          persist-credentials: false

      - name: Checkout Qt Base 6.11.2
        uses: actions/checkout@v4
        with:
          repository: qt/qtbase
          ref: v6.11.2
          path: qtbase
          persist-credentials: false

      - name: Checkout Qt WebEngine 6.11.2
        uses: actions/checkout@v4
        with:
          repository: qt/qtwebengine
          ref: v6.11.2
          path: qtwebengine
          persist-credentials: false

      - name: Apply saved Qt Base patch
        working-directory: qtbase
        shell: bash
        run: |
          git apply --check ../audit/qt-math-a11y/qtbase-uia-mathml.patch
          git apply ../audit/qt-math-a11y/qtbase-uia-mathml.patch
          git diff --check
          git diff -- src/gui/accessible/qaccessible_base.h src/plugins/platforms/windows/uiautomation/qwindowsuiamainprovider.cpp

      - name: Apply saved Qt WebEngine patch
        working-directory: qtwebengine
        shell: bash
        run: |
          git apply --check ../audit/qt-math-a11y/qtwebengine-mathml.patch
          git apply ../audit/qt-math-a11y/qtwebengine-mathml.patch
          git diff --check
          git diff -- src/core/browser_accessibility_qt.cpp
