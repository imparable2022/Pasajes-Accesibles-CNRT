name: Create v1.2.16 tag

on:
  push:
    branches:
      - release/v1.2.16-trigger
    paths:
      - .github/workflows/create-v1.2.16-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.2.16-trigger
          fetch-depth: 0

      - name: Verify main and create release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          main_sha="$(git rev-parse origin/main)"
          test "$main_sha" = "7d9916b621cd92570fb21611d0bf615b044f8dcc"
          git show origin/main:pasajes_accesibles_cnrt/__init__.py | grep -Fx '__version__ = "1.2.16"'
          if git ls-remote --exit-code --tags origin refs/tags/v1.2.16 >/dev/null 2>&1; then
            echo "El tag v1.2.16 ya existe" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.2.16 "$main_sha" -m "Pasajes Accesibles CNRT 1.2.16"
          git push origin refs/tags/v1.2.16

      - name: Remove temporary trigger workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/create-v1.2.16-tag.yml
          git commit -m "chore: retirar disparador temporal de v1.2.16"
          git push origin HEAD:release/v1.2.16-trigger
