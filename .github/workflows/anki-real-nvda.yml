name: Anki - real NVDA Windows keyboard audit
on:
  push:
    branches: [audit/anki-real-nvda-2026-11]
    paths:
      - "anki-a11y/**"
      - ".github/workflows/anki-real-nvda.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anki-nvda:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout upstream NVDA system tests
        uses: actions/checkout@v4
        with:
          repository: nvaccess/nvda
          ref: release-2026.3.1
          path: nvda
          persist-credentials: false

      - name: Set up Python used by NVDA
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Robot Framework dependencies
        shell: pwsh
        run: python -m pip install robotframework==7.5 robotremoteserver==1.1.1 robotframework-screencaplibrary==1.6.0 pywin32

      - name: Install verified official Anki
        shell: pwsh
        run: ./anki-a11y/get-anki.ps1 -Tag '26.09.4'

      - name: Fetch and verify NVDA installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force nvda-installer | Out-Null
          $file = Join-Path (Resolve-Path nvda-installer).Path 'nvda_2026.3.1.exe'
          Invoke-WebRequest -Uri 'https://download.nvaccess.org/releases/2026.3.1/nvda_2026.3.1.exe' -OutFile $file
          $expected = '6f80a5b0ca720a7d0d314b5be212f37388bbe81a1107ac3298c1821a1cd3f052'
          if ((Get-FileHash $file -Algorithm SHA256).Hash -ine $expected) { throw 'NVDA checksum mismatch' }

      - name: Install NVDA with its official CI installer
        shell: pwsh
        run: |
          $env:nvdaLauncherDir = (Resolve-Path nvda-installer).Path
          New-Item -ItemType Directory -Force nvda/testOutput/install | Out-Null
          Push-Location nvda
          try {
            ./ci/scripts/installNVDA.ps1
            if ($LASTEXITCODE -ne 0) { throw "NVDA installation exit: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Register Anki tests in NVDA Robot test harness
        shell: pwsh
        run: |
          Copy-Item anki-a11y/AnkiNvdaTests.py nvda/tests/system/robot/
          Copy-Item anki-a11y/ankiNvda.robot nvda/tests/system/robot/

      - name: Run real NVDA speech and keyboard smoke
        shell: pwsh
        env:
          ANKI_A11Y_OUTPUT: ${{ github.workspace }}\out\a11y
          ANKI_A11Y_ADDON_SOURCE: ${{ github.workspace }}\anki-a11y\experimental-review-announcer
        run: |
          New-Item -ItemType Directory -Force out/a11y | Out-Null
          Push-Location nvda
          try {
            python -m robot --argumentfile tests/system/robotArgs.robot --variable whichNVDA:installed --include anki --outputdir ../out/a11y tests/system/robot/ankiNvda.robot
            if ($LASTEXITCODE -ne 0) { throw "NVDA Robot suite exit $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Print NVDA speech trace for diagnosis
        if: always()
        shell: pwsh
        run: |
          if (Test-Path out/a11y/speech.json) {
            $j = Get-Content out/a11y/speech.json -Raw | ConvertFrom-Json
            Write-Host "Speech records: $($j.records.Count)"
            $j.records | Select-Object -Last 40 | ConvertTo-Json -Depth 6 | Write-Host
          } else { Write-Host 'No speech trace produced' }

      - name: Upload speech evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anki-real-nvda-evidence
          path: |
            out/a11y/
            nvda/testOutput/system/
          if-no-files-found: warn
