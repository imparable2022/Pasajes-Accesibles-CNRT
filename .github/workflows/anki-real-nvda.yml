name: Anki - real NVDA Windows keyboard audit
on:
  push:
    branches: [audit/anki-a11y-generalized-2026-11]
    paths:
      - "anki-a11y/**"
      - ".github/workflows/anki-real-nvda.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anki-nvda:
    name: NVDA review rich-focus=${{ matrix.rich_focus }}
    strategy:
      fail-fast: false
      matrix:
        rich_focus: [false, true]
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout upstream NVDA system tests
        uses: actions/checkout@v4
        with:
          repository: nvaccess/nvda
          ref: release-2026.3.1
          path: nvda
          persist-credentials: false

      - name: Set up Python used by NVDA
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Robot Framework dependencies
        shell: pwsh
        run: python -m pip install robotframework==7.5 robotremoteserver==1.1.1 robotframework-screencaplibrary==1.6.0 pywin32 uiautomation==2.0.29

      - name: Validate policy defaults, editor instrumentation and JS syntax
        shell: pwsh
        run: python anki-a11y/test_policy.py -v

      - name: Fetch upstream Anki source for patch review
        uses: actions/checkout@v4
        with:
          repository: ankitects/anki
          ref: 827f4aa42681f1d60ab0fe4ad76eb75d767a385e
          path: upstream-anki
          sparse-checkout: |
            ts/routes/editor/NoteEditor.svelte
            ts/routes/editor/rich-text-input/RichTextInput.svelte
            ts/routes/editor/plain-text-input/PlainTextInput.svelte
            ts/routes/editor/CodeMirror.svelte
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify proposed editor patch applies to upstream source
        shell: pwsh
        run: |
          Push-Location upstream-anki
          try {
            # Windows checkout may convert .patch to CRLF, which makes Git
            # reject every hunk against the repository's LF blob objects.
            $original = Get-Content "../anki-a11y/upstream-ready/0001-editor-fields-accessible-names.patch" -Raw
            $normalized = $original.Replace("`r`n", "`n")
            $patchFile = Join-Path $env:RUNNER_TEMP 'anki-editor-upstream-lf.patch'
            [System.IO.File]::WriteAllText($patchFile, $normalized, [System.Text.UTF8Encoding]::new($false))
            git apply --cached --check $patchFile
            if ($LASTEXITCODE -ne 0) { throw "Proposed upstream Svelte patch cannot apply" }
          } finally { Pop-Location }

      - name: Install verified official Anki
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./anki-a11y/get-anki.ps1 -Tag '26.09.4'

      - name: Fetch and verify NVDA installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force nvda-installer | Out-Null
          $file = Join-Path (Resolve-Path nvda-installer).Path 'nvda_2026.3.1.exe'
          Invoke-WebRequest -Uri 'https://download.nvaccess.org/releases/2026.3.1/nvda_2026.3.1.exe' -OutFile $file
          $expected = '6f80a5b0ca720a7d0d314b5be212f37388bbe81a1107ac3298c1821a1cd3f052'
          if ((Get-FileHash $file -Algorithm SHA256).Hash -ine $expected) { throw 'NVDA checksum mismatch' }

      - name: Install NVDA with its official CI installer
        shell: pwsh
        run: |
          $env:nvdaLauncherDir = (Resolve-Path nvda-installer).Path
          New-Item -ItemType Directory -Force nvda/testOutput/install | Out-Null
          Push-Location nvda
          try {
            ./ci/scripts/installNVDA.ps1
            if ($LASTEXITCODE -ne 0) { throw "NVDA installation exit: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Register Anki tests in NVDA Robot test harness
        shell: pwsh
        run: |
          Copy-Item anki-a11y/AnkiNvdaTests.py nvda/tests/system/robot/
          Copy-Item anki-a11y/ankiNvda.robot nvda/tests/system/robot/
          Copy-Item anki-a11y/MathCATChromeControl.py nvda/tests/system/robot/
          Copy-Item anki-a11y/ankiChromeMathcat.robot nvda/tests/system/robot/

      - name: Run real NVDA speech and keyboard smoke
        shell: pwsh
        env:
          ANKI_A11Y_OUTPUT: ${{ github.workspace }}\out\a11y
          ANKI_A11Y_ADDON_SOURCE: ${{ github.workspace }}\anki-a11y\anki-accessibility-prototype
          ANKI_A11Y_FIXTURE_SOURCE: ${{ github.workspace }}\anki-a11y\anki-fixture-loader
          ANKI_A11Y_CI: '1'
          ANKI_A11Y_RICH_FOCUS: ${{ matrix.rich_focus }}
          ANKI_A11Y_FIXTURE_FILTER: Math,MathExponent,MathEquation,Image,Audio
        run: |
          New-Item -ItemType Directory -Force out/a11y | Out-Null
          Push-Location nvda
          try {
            python -m robot --argumentfile tests/system/robotArgs.robot --variable whichNVDA:installed --include anki --outputdir ../out/a11y tests/system/robot/ankiNvda.robot
            if ($LASTEXITCODE -ne 0) { throw "NVDA Robot suite exit $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Verify ordinary keyboard navigation with no screen reader
        if: always()
        shell: pwsh
        env:
          ANKI_A11Y_OUTPUT: ${{ github.workspace }}\out\a11y
        run: |
          if (-not $env:ANKI_EXE) {
            Write-Host "Skipping no-reader check because Anki was never installed."
          } else {
            python anki-a11y/AnkiNoAtKeyboard.py
            if ($LASTEXITCODE -ne 0) { throw "No-reader keyboard regression test failed" }
          }

      - name: Evaluate actual screen-reader semantics for complex cards
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $file = "out/a11y/semantic-audit.json"
          if (-not (Test-Path $file)) { throw "No real-NVDA semantic-audit.json produced" }
          $data = Get-Content $file -Raw | ConvertFrom-Json
          $failed = @($data.tests | Where-Object { -not $_.passed })
          Write-Host "Semantic criteria checked: $(@($data.tests).Count). Unverified: $($failed.Count)"
          $data.tests | ForEach-Object {
            $outcome = if ($_.passed) { "PASS" } else { "UNVERIFIED" }
            Write-Host "$outcome $($_.kind) : $($_.criterion)"
          }
          @(
            "### Actual NVDA semantic checks (not DOM claims)"
            ""
            "| Type | Criterion | Result |"
            "| --- | --- | --- |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $data.tests | ForEach-Object {
            $outcome = if ($_.passed) { "PASS" } else { "UNVERIFIED" }
            "| $($_.kind) | $($_.criterion) | $outcome |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if ($failed.Count -gt 0) {
            throw "Some semantic criteria are not proven by actual NVDA speech: $($failed.Count)"
          }

      - name: Control experiment - true MathML with Chrome and NVDA MathCAT
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          ANKI_A11Y_OUTPUT: ${{ github.workspace }}\out\a11y
        run: |
          if (-not (Test-Path nvda/tests/system/robot/ankiChromeMathcat.robot)) {
            throw "Chrome MathCAT control suite was not prepared"
          }
          Push-Location nvda
          try {
            python -m robot --argumentfile tests/system/robotArgs.robot --variable whichNVDA:installed --include mathcat --outputdir ../out/a11y --output chrome-output.xml --log chrome-log.html --report chrome-report.html tests/system/robot/ankiChromeMathcat.robot
            if ($LASTEXITCODE -ne 0) { throw "Chrome MathCAT control exit $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Print NVDA speech trace for diagnosis
        if: always()
        shell: pwsh
        run: |
          if (Test-Path out/a11y/speech.json) {
            $j = Get-Content out/a11y/speech.json -Raw | ConvertFrom-Json
            Write-Host "Speech records: $($j.records.Count)"
            $j.records | Where-Object { $_.stage -match 'AUTOMATIC_NVDA|HOOK_STATUS|CONTENT_SPOKEN|CARD_READING_FAILURE|ACCESSIBILITY_FINDING|EDITOR_FRONT_LABEL|EDITOR_BACK_LABEL|REVIEWER_DOM_STATE|REVIEW_GRADED' } | ConvertTo-Json -Depth 6 | Write-Host
            $j.records | Where-Object { $_.stage -match 'MULTIFORMAT_|RENDERED_MATHML_DIAGNOSTICS|SEMANTIC_AUDIT_CHECK|BUTTON_SEARCH_FAILED|FIXTURE_DECK_' } | Select-Object -Last 90 | ConvertTo-Json -Depth 6 | Write-Host
          } else { Write-Host 'No speech trace produced' }

      - name: Upload speech evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anki-real-nvda-evidence-rich-${{ matrix.rich_focus }}
          path: |
            out/a11y/speech.json
            out/a11y/semantic-audit.json
            out/a11y/chrome-mathcat-control.json
            out/a11y/chrome-output.xml
            out/a11y/chrome-log.html
            out/a11y/anki-startup.log
            out/a11y/no-at-keyboard.json
            out/a11y/no-at-anki-startup.log
            out/a11y/output.xml
            out/a11y/log.html
            out/a11y/report.html
            out/a11y/systemTests.xml
            nvda/testOutput/system/*.log
          if-no-files-found: warn
