name: Sync latest download aliases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-latest-downloads.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-2025
    steps:
      - name: Add stable download names to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = gh release view --repo "$env:GITHUB_REPOSITORY" --json tagName --jq ".tagName"
          if (-not $tag) { throw "No se encontro una release estable" }

          $version = $tag.TrimStart('v')
          $work = "latest-downloads"
          New-Item -ItemType Directory -Force $work | Out-Null

          $installerVersioned = "Pasajes_Accesibles_CNRT_Setup_v$version.exe"
          $portableVersioned = "Pasajes_Accesibles_CNRT_Portable_v$version.zip"

          gh release download $tag --repo "$env:GITHUB_REPOSITORY" `
            --pattern $installerVersioned `
            --pattern $portableVersioned `
            --dir $work

          $installerLatest = Join-Path $work "Pasajes_Accesibles_CNRT_Setup.exe"
          $portableLatest = Join-Path $work "Pasajes_Accesibles_CNRT_Portable.zip"

          Copy-Item (Join-Path $work $installerVersioned) $installerLatest -Force
          Copy-Item (Join-Path $work $portableVersioned) $portableLatest -Force

          foreach ($file in @($installerLatest, $portableLatest)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256" -Encoding ascii
          }

          gh release upload $tag --repo "$env:GITHUB_REPOSITORY" `
            $installerLatest "$installerLatest.sha256" `
            $portableLatest "$portableLatest.sha256" `
            --clobber
