name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag and package version
        shell: pwsh
        run: |
          $packageVersion = python -c "import pasajes_accesibles_cnrt; print(pasajes_accesibles_cnrt.__version__)"
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "El tag $tagVersion no coincide con __version__=$packageVersion"
          }

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -q

      - name: Compile Python sources
        run: python -m compileall -q pasajes_accesibles_cnrt launcher.py tools

      - name: Inject update repository
        run: python tools/generate_build_info.py --repository "${{ github.repository }}"

      - name: Verify injected update repository
        shell: pwsh
        run: |
          $repository = python -c "from pasajes_accesibles_cnrt.build_info import GITHUB_REPOSITORY; print(GITHUB_REPOSITORY)"
          if ($repository -ne "${{ github.repository }}") {
            throw "El repositorio de actualizaciones no quedo inyectado correctamente"
          }

      - name: Install Playwright Chromium locally
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "${{ github.workspace }}\build\ms-playwright"
          python -m playwright install chromium

      - name: Build application
        run: pyinstaller --noconfirm PasajesAccesiblesCNRT.spec

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "No se encontro Inno Setup" }
          $version = "${{ github.ref_name }}".TrimStart('v')
          & $iscc "/DAppVersion=$version" "/DBuildRoot=${{ github.workspace }}\dist\Pasajes Accesibles CNRT" "/DBrowserRoot=${{ github.workspace }}\build\ms-playwright" installer\PasajesAccesiblesCNRT.iss

      - name: Write SHA-256
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $file = "release\Pasajes_Accesibles_CNRT_Setup_v$version.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  Pasajes_Accesibles_CNRT_Setup_v$version.exe" | Set-Content "$file.sha256" -Encoding ascii

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $installer = "release\Pasajes_Accesibles_CNRT_Setup_v$version.exe"
          $checksum = "$installer.sha256"
          gh release create "${{ github.ref_name }}" $installer $checksum --title "Pasajes Accesibles CNRT $version" --generate-notes
