name: Validate generic NVDA UIA MathML draft
on:
  push:
    branches: [audit/anki-a11y-generalized-2026-11]
    paths:
      - "qt-math-a11y/**"
      - ".github/workflows/qt-math-a11y-nvda-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit patches
        uses: actions/checkout@v4
        with:
          path: audit
          persist-credentials: false

      - name: Checkout NVDA 2026.3.1
        uses: actions/checkout@v4
        with:
          repository: nvaccess/nvda
          ref: release-2026.3.1
          path: nvda
          persist-credentials: false

      - name: Apply saved NVDA patch
        working-directory: nvda
        shell: bash
        run: |
          git apply --check ../audit/qt-math-a11y/nvda-generic-uia-math.patch
          git apply ../audit/qt-math-a11y/nvda-generic-uia-math.patch
          git diff --check
          python -m py_compile source/NVDAObjects/UIA/__init__.py
          git diff -- source/NVDAObjects/UIA/__init__.py
