name: Temporary validation v1.2.18

on:
  push:
    branches:
      - "fix/datepicker-reserva-v1.2.18"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Compile Python sources
        run: python -m compileall -q pasajes_accesibles_cnrt launcher.py portable_updater.py tools
